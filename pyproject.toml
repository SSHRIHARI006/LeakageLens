[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakagelens"
version = "0.1.0"
description = "Evidence-based data leakage audits for tabular machine learning"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "fastapi>=0.110,<0.116", "uvicorn>=0.27", "streamlit>=1.30", "plotly>=5.18", "openpyxl>=3.1", "xlrd>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<0.28", "ruff>=0.5", "pyarrow>=14.0"]

[tool.setuptools]
packages = ["leakagelens", "validation", "validation.generators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
